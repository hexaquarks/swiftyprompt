name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        run: |
          curl --fail --location --remote-name https://github.com/neovim/neovim/releases/download/v0.11.2/nvim-linux-x86_64.tar.gz
          tar xzf nvim-linux-x86_64.tar.gz
          echo "$GITHUB_WORKSPACE/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install Plenary
        run: git clone --depth 1 https://github.com/nvim-lua/plenary.nvim .tests/plenary.nvim

      - name: Install Markdown renderer
        run: git clone --depth 1 --branch v8.14.0 https://github.com/MeanderingProgrammer/render-markdown.nvim .tests/render-markdown.nvim

      - name: Run tests
        env:
          PLENARY_DIR: ${{ github.workspace }}/.tests/plenary.nvim
          RENDER_MARKDOWN_DIR: ${{ github.workspace }}/.tests/render-markdown.nvim
        run: |
          nvim --headless --noplugin -u NONE \
            --cmd "set rtp+=$PLENARY_DIR" \
            -c "runtime plugin/plenary.vim" \
            -c "PlenaryBustedDirectory tests/ { minimal_init = 'tests/minimal_init.lua', sequential = true }"
